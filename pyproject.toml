[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "document-processing-toolkit"
version = "0.1.0"
description = "A lightweight open-source Python toolkit for local document extraction, text normalisation, file fingerprinting and duplicate detection."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Contributors", email = "nobody@example.com"}
]
requires-python = ">=3.10"
dependencies = [
    "pypdf>=7.0.0"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing",
    "Topic :: Utilities",
]
keywords = ["document", "pdf", "text-extraction", "deduplication", "hash", "fingerprint"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
document-toolkit = "document_toolkit.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["document_toolkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]